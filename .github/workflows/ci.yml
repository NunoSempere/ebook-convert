name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Vendored tree has no unrewritten imports and imports cleanly
        run: |
          python3 tools/vendor.py --check
          uv run python tools/check_imports.py
      - name: Test
        run: uv run pytest -v
      - name: Build sdist and wheel
        run: uv build
      - name: Check the README renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel with uvx
        run: |
          uvx --isolated --python ${{ matrix.python-version }} --from dist/*.whl ebook-convert tests/fixtures/sample.txt out.epub
          test -s out.epub
